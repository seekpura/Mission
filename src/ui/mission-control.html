<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mission Control</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#111;background:#f5f5f3}body{margin:0}.shell{max-width:1180px;margin:0 auto;padding:40px 24px}.top{display:flex;justify-content:space-between;gap:24px;align-items:end}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#666}.title{font-size:42px;line-height:1;margin:8px 0}.muted{color:#666}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:28px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.03)}.metric{font-size:28px;font-weight:650}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.pill{padding:4px 8px;border-radius:999px;background:#efefec;font-size:12px}.wide{grid-column:1/-1}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:280px;overflow:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.title{font-size:32px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div><div class="eyebrow">Mission Runtime</div><div class="title">Mission Control</div><div class="muted">State, blockers, artifacts and decisions—not fake progress percentages.</div></div><div class="pill" id="connection">offline</div></div>
  <div class="grid">
    <section class="card"><div class="eyebrow">Mission</div><div class="metric" id="status">—</div><div class="muted" id="mission">Open /?mission=&lt;id&gt;</div></section>
    <section class="card"><div class="eyebrow">Blocking gaps</div><div class="metric" id="gaps">0</div></section>
    <section class="card"><div class="eyebrow">Active work</div><div id="work"></div></section>
    <section class="card"><div class="eyebrow">Artifacts</div><div id="artifacts"></div></section>
    <section class="card wide"><div class="eyebrow">Current state</div><pre id="raw">Waiting for mission id…</pre></section>
  </div>
</div>
<script>
const missionId=new URLSearchParams(location.search).get('mission');
if(missionId){document.getElementById('mission').textContent=missionId;const es=new EventSource('/missions/'+encodeURIComponent(missionId)+'/events');es.onopen=()=>connection.textContent='live';es.onerror=()=>connection.textContent='reconnecting';es.addEventListener('mission.updated',e=>render(JSON.parse(e.data)));fetch('/missions/'+encodeURIComponent(missionId)).then(r=>r.json()).then(render)}
function render(s){status.textContent=s.status;gaps.textContent=s.blockingGapIds.length;work.innerHTML=[...s.activeWorkItemIds,...s.readyWorkItemIds].map(x=>'<div class="row"><span>'+esc(x)+'</span><span class="pill">work</span></div>').join('')||'<div class="muted">No active work</div>';artifacts.innerHTML=s.finalArtifactRefs.map(x=>'<div class="row"><span>'+esc(x)+'</span><span class="pill">final</span></div>').join('')||'<div class="muted">No final artifacts</div>';raw.textContent=JSON.stringify(s,null,2)}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
