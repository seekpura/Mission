name: Apply runtime integration verification batch
on:
  push:
    branches: [build/runtime-integration-verification]
    paths:
      - scripts/apply-runtime-integration-verification.sh
      - .github/workflows/apply-runtime-integration-verification.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/runtime-integration-verification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify
        run: bash scripts/apply-runtime-integration-verification.sh
      - name: Commit batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'build: apply runtime integration verification batch'
          git push origin HEAD:build/runtime-integration-verification
