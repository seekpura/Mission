name: Apply plateau escalation
on:
  push:
    branches: [build/plateau-escalation]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic plateau escalation
        run: |
          bash scripts/apply-plateau-escalation.sh
          npm test
          npm run smoke
          git diff --check
      - name: Commit implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/mission/controller.ts
          git commit -m "feat: enforce deterministic plateau repair escalation"
          git push
