name: Budget diagnostics
on:
  push:
    branches: [build/budget-enforcement]
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch and capture diagnostics
        shell: bash
        run: |
          set +e
          bash scripts/apply-budget-enforcement.sh > .budget-test.log 2>&1
          patch_code=$?
          npm test >> .budget-test.log 2>&1
          test_code=$?
          npm run smoke >> .budget-test.log 2>&1
          smoke_code=$?
          git diff --check >> .budget-test.log 2>&1
          diff_code=$?
          echo "PATCH_EXIT=$patch_code TEST_EXIT=$test_code SMOKE_EXIT=$smoke_code DIFF_EXIT=$diff_code" >> .budget-test.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .budget-test.log src/core/domain/mission.ts src/core/domain/event.ts src/core/events/state-projector.ts src/runtime/mission-runtime.ts src/runtime/orchestration/mission-orchestrator.ts
          git commit -m "diagnostic: capture budget enforcement failure" || true
          git push || true
          exit $(( patch_code || test_code || smoke_code || diff_code ))
