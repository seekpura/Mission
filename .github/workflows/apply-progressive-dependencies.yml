name: Apply progressive dependencies
on:
  push:
    branches: [build/reference-mission-e2e]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify progressive dependency runtime
        run: |
          bash scripts/apply-progressive-dependencies.sh
          npm test
          npm run smoke
          git diff --check
      - name: Commit implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/mission/controller.ts src/runtime/orchestration/mission-orchestrator.ts
          git commit -m "feat: continue rolling frontier with artifact dependency gates"
          git push
