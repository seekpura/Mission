name: Apply freshness gate
on:
  push:
    branches: [build/freshness-gate]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify freshness gate
        run: |
          bash scripts/apply-freshness-gate.sh
          npm test
          npm run smoke
          git diff --check
      - name: Commit implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/orchestration/mission-orchestrator.ts src/runtime/mission-runtime.ts
          git commit -m "feat: gate mission cycles on source freshness"
          git push
