name: agent05-custom-host-delivery-gate

on:
  push:
    branches:
      - feat/codex-production-host-adapter
    paths:
      - .github/workflows/agent05-custom-host-delivery-gate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codex-production-host-adapter
          fetch-depth: 0
      - name: Make custom Host Skill delivery explicit and fail closed
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/runtime/bootstrap.ts')
          text = path.read_text(encoding='utf-8')
          approval_line = '  const approvalHandler = (request: Parameters<RuntimeSideEffectManager["authorizeHostPermission"]>[0]) =>\n'
          gate = '  if (options.host && options.capabilityAcquisition) {\n    throw new Error(\n      "A custom HostAdapter cannot use production Agent Skill acquisition without an explicit provider-native Skill delivery adapter"\n    );\n  }\n'
          if text.count(approval_line) != 1:
              raise SystemExit(f'approval anchor count={text.count(approval_line)}')
          text = text.replace(approval_line, gate + approval_line)
          old = '  const capabilityHost = hostKind === "deepseek" || options.host\n'
          new = '  const capabilityHost = !options.host && hostKind === "deepseek"\n'
          if text.count(old) != 1:
              raise SystemExit(f'delivery anchor count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit bounded migration and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent05-custom-host-delivery-gate.yml
          git add src/runtime/bootstrap.ts
          git diff --cached --check
          git commit -m "fix: require explicit Skill delivery for custom hosts"
          git push origin HEAD:feat/codex-production-host-adapter
