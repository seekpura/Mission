name: Apply knowledge context
on:
  push:
    branches: [build/knowledge-context]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify knowledge context
        run: |
          bash scripts/apply-knowledge-context.sh
          npm test
          npm run smoke
          git diff --check
      - name: Commit implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/orchestration/mission-orchestrator.ts
          git commit -m "feat: inject relevant active knowledge into worker context"
          git push
