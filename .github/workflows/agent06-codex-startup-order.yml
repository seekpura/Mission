name: agent06-codex-startup-order

on:
  push:
    branches:
      - feat/production-typecheck-schema-gates
    paths:
      - .github/workflows/agent06-codex-startup-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-typecheck-schema-gates
      - name: Validate and apply bounded patch
        run: |
          python -m py_compile scripts/agent06-codex-startup-order.py
          python scripts/agent06-codex-startup-order.py
      - name: Commit deterministic lifecycle fix and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent06-codex-startup-order.yml scripts/agent06-codex-startup-order.py
          git add src/hosts/codex/codex-app-server-host-adapter.ts tests/integration/codex-app-server-host-adapter.test.ts
          git diff --cached --check
          git commit -m "fix: preserve Codex startup event ordering"
          git push origin HEAD:feat/production-typecheck-schema-gates
