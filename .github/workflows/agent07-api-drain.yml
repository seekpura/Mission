name: agent07-api-drain

on:
  push:
    branches:
      - feat/graceful-shutdown-drain
    paths:
      - .github/workflows/agent07-api-drain.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graceful-shutdown-drain
      - name: Validate and apply API drain patch
        run: |
          python -m py_compile scripts/agent07-api-drain.py
          python scripts/agent07-api-drain.py
      - name: Commit API drain and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent07-api-drain.yml scripts/agent07-api-drain.py
          git add src/server/mission-api.ts
          git diff --cached --check
          git commit -m "feat: drain admitted HTTP requests before runtime close"
          git push origin HEAD:feat/graceful-shutdown-drain
