name: agent07-test-fixture-fix

on:
  push:
    branches:
      - feat/graceful-shutdown-drain
    paths:
      - .github/workflows/agent07-test-fixture-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graceful-shutdown-drain
      - name: Fix strict MissionState test fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/graceful-shutdown.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '} as MissionState;'
          new = '} as unknown as MissionState;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one MissionState fixture cast, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent07-test-fixture-fix.yml
          git add tests/integration/graceful-shutdown.test.ts
          git diff --cached --check
          git commit -m "test: make shutdown MissionState fixture explicit"
          git push origin HEAD:feat/graceful-shutdown-drain
