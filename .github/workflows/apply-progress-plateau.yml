name: Apply progress plateau engine
on:
  push:
    branches: [build/progress-plateau]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify progress plateau engine
        run: |
          chmod +x scripts/fix-progress-patch-anchor.sh scripts/fix-progress-host-anchor.sh scripts/apply-progress-plateau.sh
          ./scripts/fix-progress-patch-anchor.sh
          ./scripts/fix-progress-host-anchor.sh
          ./scripts/apply-progress-plateau.sh
          npm test
          npm run smoke
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'feat: detect progress stalls and truthful plateau' || exit 0
          git push origin HEAD:build/progress-plateau
