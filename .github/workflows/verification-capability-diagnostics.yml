name: Capture verification capability diagnostics
on:
  push:
    branches: [build/verification-capability-escalation]
    paths:
      - .github/workflows/verification-capability-diagnostics.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/verification-capability-escalation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture tests
        run: |
          set +e
          npm test > .verification-capability-test.log 2>&1
          CODE=$?
          npm run smoke >> .verification-capability-test.log 2>&1
          SMOKE=$?
          git diff --check >> .verification-capability-test.log 2>&1
          DIFF=$?
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .verification-capability-test.log
          git commit -m 'chore: record verification capability diagnostics' || true
          git push origin HEAD:build/verification-capability-escalation
          if [ "$CODE" -ne 0 ] || [ "$SMOKE" -ne 0 ] || [ "$DIFF" -ne 0 ]; then exit 1; fi
