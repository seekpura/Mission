name: Verify source refresh rebinding
on:
  push:
    branches: [build/source-refresh-rebinding]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source refresh rebinding
        run: |
          npm test
          npm run smoke
          git diff --check
