name: Governance diagnostics
on:
  push:
    branches: [build/governance-ledger]
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch and capture diagnostics
        shell: bash
        run: |
          set +e
          bash scripts/apply-governance-ledger.sh > .governance-test.log 2>&1
          patch_code=$?
          npm test >> .governance-test.log 2>&1
          test_code=$?
          npm run smoke >> .governance-test.log 2>&1
          smoke_code=$?
          git diff --check >> .governance-test.log 2>&1
          diff_code=$?
          echo "PATCH_EXIT=$patch_code TEST_EXIT=$test_code SMOKE_EXIT=$smoke_code DIFF_EXIT=$diff_code" >> .governance-test.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .governance-test.log src/core/events/projection-store.ts src/persistence/sqlite/schema.sql src/persistence/sqlite/sqlite-projection-store.ts
          git commit -m "diagnostic: capture governance ledger failure" || true
          git push || true
          exit $(( patch_code || test_code || smoke_code || diff_code ))
