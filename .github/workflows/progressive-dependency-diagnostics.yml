name: Progressive dependency diagnostics
on:
  push:
    branches: [build/reference-mission-e2e]
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          bash scripts/apply-progressive-dependencies.sh > .progressive-dependency-test.log 2>&1
          patch_code=$?
          npm test >> .progressive-dependency-test.log 2>&1
          test_code=$?
          npm run smoke >> .progressive-dependency-test.log 2>&1
          smoke_code=$?
          git diff --check >> .progressive-dependency-test.log 2>&1
          diff_code=$?
          echo "PATCH_EXIT=$patch_code TEST_EXIT=$test_code SMOKE_EXIT=$smoke_code DIFF_EXIT=$diff_code" >> .progressive-dependency-test.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .progressive-dependency-test.log src/core/mission/controller.ts src/runtime/orchestration/mission-orchestrator.ts
          git commit -m "diagnostic: capture progressive dependency failure" || true
          git push || true
          exit $(( patch_code || test_code || smoke_code || diff_code ))
