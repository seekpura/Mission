name: Validate cancellation recovery batch
on:
  push:
    branches: [build/cancellation-recovery]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/cancellation-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate applied batch
        run: |
          npm test
          npm run smoke
          git diff --check
