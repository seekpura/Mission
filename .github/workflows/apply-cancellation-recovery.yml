name: Apply cancellation recovery batch
on:
  push:
    branches: [build/cancellation-recovery]
    paths:
      - scripts/apply-cancellation-recovery.sh
      - scripts/fix-cancellation-recovery.sh
      - .github/workflows/apply-cancellation-recovery.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/cancellation-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify
        run: |
          awk '/^npm test$/{exit} {print}' scripts/apply-cancellation-recovery.sh | bash
          bash scripts/fix-cancellation-recovery.sh
          npm test
          npm run smoke
          git diff --check
      - name: Commit batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'build: apply cancellation recovery batch'
          git push origin HEAD:build/cancellation-recovery
