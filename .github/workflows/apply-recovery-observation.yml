name: Apply recovery observation batch
on:
  push:
    branches: [build/recovery-observation]
    paths:
      - scripts/apply-recovery-observation.sh
      - .github/workflows/apply-recovery-observation.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/recovery-observation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify
        run: bash scripts/apply-recovery-observation.sh
      - name: Commit batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'build: apply recovery by observation batch'
          git push origin HEAD:build/recovery-observation
