name: agent05-neutralize-host-imports

on:
  push:
    branches:
      - feat/codex-production-host-adapter
    paths:
      - .github/workflows/agent05-neutralize-host-imports.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codex-production-host-adapter
          fetch-depth: 0
      - name: Replace the three remaining provider-namespaced HostAdapter imports
        shell: python
        run: |
          from pathlib import Path

          old = '../hosts/deepseek/host-adapter.ts'
          new = '../hosts/host-adapter.ts'
          paths = [
              Path('src/runtime/host-deliberation-provider.ts'),
              Path('src/runtime/side-effect-manager.ts'),
              Path('src/runtime/trusted-mcp-runtime.ts'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one old HostAdapter import, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit bounded migration and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent05-neutralize-host-imports.yml
          git add src/runtime/host-deliberation-provider.ts src/runtime/side-effect-manager.ts src/runtime/trusted-mcp-runtime.ts
          git diff --cached --check
          git commit -m "refactor: finish provider-neutral host contract imports"
          git push origin HEAD:feat/codex-production-host-adapter
