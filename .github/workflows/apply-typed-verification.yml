name: Apply typed verification batch
on:
  push:
    branches: [build/typed-verification]
    paths:
      - scripts/apply-typed-verification.sh
      - .github/workflows/apply-typed-verification.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/typed-verification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply, capture verification, and publish diagnostics
        run: |
          awk '/^npm test$/{exit} {print}' scripts/apply-typed-verification.sh | bash
          set +e
          npm test > .typed-verification-test.log 2>&1
          TEST_CODE=$?
          npm run smoke >> .typed-verification-test.log 2>&1
          SMOKE_CODE=$?
          git diff --check >> .typed-verification-test.log 2>&1
          DIFF_CODE=$?
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .typed-verification-test.log
          git commit -m 'build: apply typed verification batch with diagnostics'
          git push origin HEAD:build/typed-verification
          if [ "$TEST_CODE" -ne 0 ] || [ "$SMOKE_CODE" -ne 0 ] || [ "$DIFF_CODE" -ne 0 ]; then exit 1; fi
