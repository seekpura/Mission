name: Apply typed verification batch
on:
  push:
    branches: [build/typed-verification]
    paths:
      - scripts/apply-typed-verification.sh
      - .github/workflows/apply-typed-verification.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/typed-verification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify
        run: bash scripts/apply-typed-verification.sh
      - name: Commit batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'build: apply typed verification batch'
          git push origin HEAD:build/typed-verification
