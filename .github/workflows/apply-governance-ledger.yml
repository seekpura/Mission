name: Apply governance ledger
on:
  push:
    branches: [build/governance-ledger]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify governance ledger
        run: |
          bash scripts/apply-governance-ledger.sh
          npm test
          npm run smoke
          git diff --check
      - name: Commit implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/events/projection-store.ts src/persistence/sqlite/schema.sql src/persistence/sqlite/sqlite-projection-store.ts
          git commit -m "feat: persist governance cost audit trust and completion ledgers"
          git push
