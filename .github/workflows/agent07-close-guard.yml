name: agent07-close-guard

on:
  push:
    branches:
      - feat/graceful-shutdown-drain
    paths:
      - .github/workflows/agent07-close-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graceful-shutdown-drain
      - name: Apply close guard
        run: |
          python -m py_compile scripts/agent07-close-guard.py
          python scripts/agent07-close-guard.py
      - name: Commit guard and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent07-close-guard.yml scripts/agent07-close-guard.py
          git add src/runtime/bootstrap.ts
          git diff --cached --check
          git commit -m "fix: reject synchronous close during async shutdown"
          git push origin HEAD:feat/graceful-shutdown-drain
