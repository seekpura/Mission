name: Apply source truth staleness
on:
  push:
    branches: [build/source-truth-staleness]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and verify source truth staleness
        run: |
          bash scripts/apply-source-truth-staleness.sh
          npm test
          npm run smoke
          git diff --check
      - name: Commit implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "feat: add durable source truth and staleness propagation"
          git push
