name: agent06-lockfile

on:
  push:
    branches:
      - feat/production-typecheck-schema-gates
    paths:
      - .github/workflows/agent06-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-typecheck-schema-gates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "build: lock production typecheck dependencies"
          git push origin HEAD:feat/production-typecheck-schema-gates
